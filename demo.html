<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>School Chatbot — Demo</title>
    <style>
      body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:24px;color:#111}
      .card{max-width:760px;margin:0 auto;padding:18px;border:1px solid #e6e6e6;border-radius:8px}
      input[type=text]{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:6px}
      button{padding:10px 14px;border-radius:6px;border:0;background:#0366d6;color:#fff}
      pre{white-space:pre-wrap;background:#f7f7f7;padding:12px;border-radius:6px}
      .meta{color:#666;font-size:0.9rem}
    </style>
  </head>
  <body>
    <div class="card">
      <h1>School Chatbot — Demo</h1>
      <p class="meta">Ask about the school and I'll reply using the knowledge base below.</p>

      <label for="q">Ask a question</label>
      <input id="q" type="text" placeholder="e.g. What are the office hours?" />
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button id="ask">Ask</button>
        <button id="random">Show random doc</button>
      </div>

      <h3>Answer</h3>
      <div id="answer"><em>Ask something above.</em></div>

      <h3>Matched Document</h3>
      <pre id="doc">(No document selected)</pre>
    </div>

    <script>
      let documents = [];

      async function loadDocs(){
        try{
          const res = await fetch('knowledge_base/school_info.txt');
          if(!res.ok) throw new Error('Failed to fetch knowledge file');
          const txt = await res.text();
          // split documents by blank line, map into {title, content}
          const parts = txt.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
          documents = parts.map(p=>{
            const lines = p.split(/\n+/).map(l=>l.trim()).filter(Boolean);
            let title = lines[0] || '';
            // remove trailing colon from titles like "School Office Hours:"
            title = title.replace(/:\s*$/, '');
            const content = lines.slice(1).join('\n') || '';
            return { title, content: (content || title), raw: p };
          });
        }catch(e){
          documents = [{title:'(error)', content:'Unable to load knowledge base.'}];
          console.error(e);
        }
      }

      function tokenize(s){
        return s.toLowerCase().replace(/["'.,?!;:()]/g,'').split(/\s+/).filter(Boolean);
      }

      function score(qTokens, contentTokens){
        let c = 0;
        for(const w of contentTokens) if(qTokens.has(w)) c++;
        return c;
      }

      function answerQuestion(q){
        if(!q || !q.trim()) return {answer:'Please type a question.', doc:null};
        const qTokens = new Set(tokenize(q));

        let best = null; let bestScore = -1;
        for(const d of documents){
          const titleTokens = tokenize(d.title);
          const contentTokens = tokenize(d.content);

          // title match gets higher weight
          const titleScore = score(qTokens, titleTokens) * 3;
          const contentScore = score(qTokens, contentTokens);
          const sc = titleScore + contentScore;

          if(sc > bestScore){ bestScore = sc; best = d; }
        }

        if(!best || bestScore <= 0){
          return {answer:"I couldn't find a direct match in the knowledge base. Try rephrasing your question (example: 'What are the office hours?').", doc:null};
        }

        // Build an answer: prefer first few lines of content, or the full content if short
        const snippet = (best.content || best.title).split('\n')[0];
        const answer = snippet || best.title;
        return {answer: answer, doc: best.raw || (best.title + '\n' + best.content)};
      }

      document.getElementById('ask').addEventListener('click', ()=>{
        const q = document.getElementById('q').value;
        const r = answerQuestion(q);
        document.getElementById('answer').textContent = r.answer;
        document.getElementById('doc').textContent = r.doc || '(no match)';
      });

      document.getElementById('q').addEventListener('keydown', (e)=>{
        if(e.key === 'Enter'){
          e.preventDefault();
          document.getElementById('ask').click();
        }
      });

      document.getElementById('random').addEventListener('click', ()=>{
        if(!documents.length) return;
        const d = documents[Math.floor(Math.random()*documents.length)];
        document.getElementById('doc').textContent = d.raw || (d.title + '\n' + d.content);
        document.getElementById('answer').textContent = (d.content || d.title).split('\n')[0];
      });

      // load docs on start
      loadDocs();
    </script>
  </body>
</html>
